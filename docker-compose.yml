services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complan
      POSTGRES_USER: complan
      POSTGRES_PASSWORD: complan
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U complan -d complan']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
